<!DOCTYPE html>
<html>
<head>
    <title>Double Pendulum Chaos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <nav class="top-bar">
        <a href="index.html" class="home-link">home</a>
        <div class="nav-right">
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </div>
    </nav>

    <canvas id="pendulumCanvas"></canvas>

    <section class="sim-ui pendulum-ui">
        <button onclick="togglePendulum()" id="pendulumToggle">pause</button>
        <button onclick="resetPendulums()">reset</button>
        <button onclick="clearPendulumTrails()">clear trails</button>

        <label>count
            <select id="countSelect" onchange="changePendulumCount()">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </label>

        <label>gravity
            <input id="gravityInput" type="range" min="0.1" max="3" step="0.1" value="1">
        </label>

        <label>speed
            <input id="speedInput" type="range" min="0.2" max="4" step="0.1" value="1">
        </label>

        <label>damping
            <input id="dampingInput" type="range" min="0.990" max="1.000" step="0.001" value="0.999">
        </label>

        <label>trail
            <input id="trailInput" type="range" min="20" max="1000" step="20" value="420">
        </label>

        <p>use the editor on the right to change rope length, mass, and starting angle</p>
    </section>

    <aside class="pendulum-editor">
        <h3>pendulum editor</h3>

        <label>pendulum
            <select id="pendulumSelect" onchange="loadPendulumEditor()"></select>
        </label>

        <label>rope 1 length <input id="l1Input" type="number" value="150"></label>
        <label>rope 2 length <input id="l2Input" type="number" value="150"></label>

        <label>ball 1 mass <input id="m1Input" type="number" value="20"></label>
        <label>ball 2 mass <input id="m2Input" type="number" value="20"></label>

        <label>angle 1 deg <input id="a1Input" type="number" value="120"></label>
        <label>angle 2 deg <input id="a2Input" type="number" value="120"></label>

        <button onclick="applyPendulumEdit()">apply</button>
        <button onclick="slightlyOffsetPendulums()">tiny offset</button>

        <p id="pendulumInfo">ready</p>
    </aside>

    <script src="pendulum.js"></script>
</body>
</html>
