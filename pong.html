<!DOCTYPE html>
<html>
<head>
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

<nav class="top-bar">
    <a href="index.html" class="home-link">home</a>
    <div class="nav-right">
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
    </div>
</nav>

<canvas id="pongCanvas"></canvas>

<section class="sim-ui">
    <button onclick="restartPong()">restart</button>
    <button onclick="togglePause()" id="pauseButton">pause</button>

    <label>mode
        <select id="modeSelect">
            <option value="ai">vs ai</option>
            <option value="two">2 player</option>
        </select>
    </label>

    <label>speed
        <input id="speedSlider" type="range" min="0.7" max="1.8" step="0.1" value="1">
    </label>

    <p>w/s: left paddle | ↑/↓: right paddle</p>
</section>

<script src="pong.js"></script>
</body>
</html>
