<!DOCTYPE html>
<html>
<head>
    <title>N-Body Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <nav class="top-bar">
        <a href="index.html" class="home-link">home</a>
        <div class="nav-right">
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </div>
    </nav>

    <canvas id="nbodyCanvas"></canvas>

    <section class="sim-ui nbody-ui">
        <button onclick="toggleSimulation()" id="toggleButton">pause</button>
        <button onclick="resetSystem()">reset</button>
        <button onclick="addBodyAtCenter()">add body</button>
        <button onclick="clearTrails()">clear trails</button>

        <label>gravity
            <input id="gravityInput" type="range" min="0.01" max="2" step="0.01" value="0.35">
        </label>

        <label>speed
            <input id="speedInput" type="range" min="0.2" max="5" step="0.1" value="1">
        </label>

        <label>trails
            <input id="trailInput" type="range" min="10" max="800" step="10" value="220">
        </label>

        <p>left click: select | shift + click: add body | middle drag: pan | scroll: zoom</p>
    </section>

    <aside class="nbody-editor">
        <h3>object editor</h3>
        <p id="bodyInfo">select a body</p>

        <label>name <input id="nameInput" value=""></label>
        <label>mass <input id="massInput" type="number" value="1000"></label>
        <label>radius <input id="radiusInput" type="number" value="8"></label>
        <label>x velocity <input id="vxInput" type="number" value="0"></label>
        <label>y velocity <input id="vyInput" type="number" value="0"></label>

        <button onclick="applyBodyEdit()">apply</button>
        <button onclick="deleteSelectedBody()">delete</button>
    </aside>

    <script src="nbody.js"></script>
</body>
</html>
