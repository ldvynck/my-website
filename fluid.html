<!DOCTYPE html>
<html>
<head>
    <title>Fluid Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <nav class="top-bar">
        <a href="index.html" class="home-link">home</a>
        <div class="nav-right">
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </div>
    </nav>

    <canvas id="fluidCanvas"></canvas>

    <section class="sim-ui">
        <button onclick="clearFluid()">clear</button>
        <button onclick="toggleObstacles()" id="obstacleButton">obstacles: off</button>

        <label>viscosity
            <input id="viscositySlider" type="range" min="0.90" max="0.995" step="0.001" value="0.970">
        </label>

        <label>brush
            <input id="brushSlider" type="range" min="2" max="20" value="8">
        </label>

        <p>left drag: add fluid | right drag: push | obstacles mode: draw walls</p>
    </section>

    <script src="fluid.js"></script>
</body>
</html>
